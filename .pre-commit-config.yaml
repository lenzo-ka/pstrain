# Pre-commit hooks for pstrain
# Install: pip install pre-commit && pre-commit install

default_language_version:
  python: python3.12

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(build/|\.eggs/)
      - id: end-of-file-fixer
        exclude: ^(build/|\.eggs/)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: \.(wav|mp3|flac|ogg)$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code quality - Ruff (fast linter and formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        files: ^(pstrain|tests)/
        exclude: ^(build/|csrc/libs/libsphinxbase/(fe|util)/.*\.py$)
      # Run the formatter
      - id: ruff-format
        files: ^(pstrain|tests)/
        exclude: ^(build/|csrc/libs/libsphinxbase/(fe|util)/.*\.py$)

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic==2.12.5, types-PyYAML==6.0.12.20250915, pytest==9.0.2]
        exclude: ^(build/|\.eggs/|csrc/)
        args: [pstrain, --ignore-missing-imports]
        pass_filenames: false

# Exclude certain paths globally
exclude: |
  (?x)^(
      csrc/|
      build/|
      venv/|
      \.eggs/|
      \.git/|
      \.mypy_cache/|
      \.ruff_cache/|
      __pycache__/|
      \.pytest_cache/
  )
