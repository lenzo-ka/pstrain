[project]
name = "pstrain"
version = "0.3.0"
description = "Continuous-density HMM/GMM acoustic model training toolkit"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE", "csrc/LICENSE.sphinx", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [
    { name = "Kevin Lenzo", email = "kevinlenzo@gmail.com" }
]
keywords = ["speech", "acoustic-model", "hmm", "gmm", "training", "asr", "speech-recognition", "forced-alignment", "pocketsphinx", "sphinx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "cffi>=1.15.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "arpabo>=0.3.0",
]

[project.optional-dependencies]
# Forced alignment runs entirely against libpstrainc via CFFI; no extra
# Python dependencies are required beyond the core ones.
align = []
# The pip PocketSphinx package is required only to resolve the dictionary for
# the `pip-en-us` benchmark band. Decoding itself goes through libpstrainc.
test = [
    "jiwer>=3.0.0",
]
bench = [
    "pocketsphinx>=5.1.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter-client>=8.0",
    "ipykernel>=6.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=4.0.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=1.0",
]
all = [
    "pstrain[align,test,bench,dev,docs]",
]

[project.scripts]
pstrain = "pstrain.cli:main"

[project.urls]
Homepage = "https://github.com/lenzo-ka/pstrain"
Repository = "https://github.com/lenzo-ka/pstrain"
Documentation = "https://github.com/lenzo-ka/pstrain/blob/main/docs/getting-started.md"
Issues = "https://github.com/lenzo-ka/pstrain/issues"
Changelog = "https://github.com/lenzo-ka/pstrain/blob/main/CHANGELOG.md"

[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"
editable.mode = "redirect"
editable.rebuild = false
sdist.include = ["benchmarks/arctic/data/**", "benchmarks/corpora/**"]
# Package files are mapped explicitly below. This keeps redirect-mode editable
# installs from adding their package search directory (the repository root) to
# sys.path; ``benchmarks`` remains data-only rather than an import package.
wheel.packages = []
# Install library and binaries to pstrain/_lib/
wheel.install-dir = "pstrain/_lib"
# PocketSphinx 5.1.1's CMake project requires 3.25+.
cmake.version = ">=3.25"

[tool.scikit-build.wheel.force-include]
"pstrain" = "pstrain"
"benchmarks/arctic/data" = "benchmarks/arctic/data"
"benchmarks/corpora" = "benchmarks/corpora"

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = "ON"
BUILD_CLI = "ON"

[tool.cibuildwheel]
build = [
    "cp311-*",
    "cp312-*",
    "cp313-*",
]
skip = [
    "*_i686",
    "*-win32",
    "*-musllinux*",
]
# Test the built wheels
# Smoke-test the *installed* wheel: import it and load the bundled libpstrainc.
# We deliberately do NOT run `pytest {project}/tests` here — pytest inserts the
# project root onto sys.path, which imports the source `pstrain/` package (no
# bundled library) instead of the wheel. The smoke script is launched from
# cibuildwheel's neutral working directory and rejects source-tree imports. The full
# test suite (including parity) runs against a dev build in the Tests workflow.
test-command = "python {project}/scripts/test_installed_distribution.py"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# Build universal2 separately if needed
# archs = ["universal2"]

[tool.cibuildwheel.linux]
# x86_64 only in CI. aarch64 Linux wheels would build under QEMU emulation on
# the x86 runner, which recompiles the large vendored C library three times
# (cp311-cp313) emulated and takes hours. Add aarch64 back on a native ARM
# runner or a release-only job when arm64 Linux wheels are needed.
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "python {project}/scripts/repair_linux_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.windows]
# cibuildwheel 4 installs delvewheel itself, but keeping the installation
# explicit documents and preserves the self-contained-wheel requirement if the
# action's defaults change.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} -v {wheel}"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pstrain"]

[tool.mypy]
# Target 3.12 so mypy can parse modern third-party stubs (e.g. NumPy's use of
# PEP 695 `type` aliases, which fail to parse under a <3.12 target). The
# package supports 3.11+ at runtime.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Runtime dependencies may be absent, untyped, or covered by mypy's bundled
# stubs depending on the environment. Keep that variability local to the two
# modules that deliberately import them.
module = ["pstrain.lib._cffi.core", "pstrain.benchmarks.arctic"]
disable_error_code = ["import-untyped"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not benchmark and not kernel'"
markers = [
    "benchmark: long-running, networked benchmark tests excluded from default runs",
    "kernel: starts a local Jupyter kernel but does not run a reproduction loop",
]
