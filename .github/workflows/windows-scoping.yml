name: Windows scoping probe

# Diagnostic only. This workflow is dispatch-only and scripts/dispatch_windows_probe.sh
# targets an empty commit on a probe ref. That distinct SHA cannot be any PR's head,
# so this intentionally tolerant population pass cannot attach as a PR check.
on:
  workflow_dispatch:

jobs:
  windows-scoping:
    name: Windows scoping (${{ matrix.compiler }})
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]

    steps:
      - uses: actions/checkout@v7

      - name: Enter the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (${{ matrix.compiler }})
        shell: pwsh
        run: |
          $build = "build-${{ matrix.compiler }}"
          $compilerArgs = @()
          if ("${{ matrix.compiler }}" -eq "clang-cl") {
            $compilerArgs += "-T"
            $compilerArgs += "ClangCL"
            $compilerArgs += "-DCMAKE_C_FLAGS=/clang:-ferror-limit=0"
          }
          cmake -S . -B $build `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_CLI=ON `
            @compilerArgs

      - name: Configure Ninja graph (${{ matrix.compiler }})
        shell: pwsh
        run: |
          $compilerArgs = @()
          if ("${{ matrix.compiler }}" -eq "clang-cl") {
            $compilerArgs += "-DCMAKE_C_COMPILER=clang-cl"
          }
          cmake -S . -B "build-ninja-${{ matrix.compiler }}" -G Ninja `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_CLI=ON `
            @compilerArgs
          ninja -C "build-ninja-${{ matrix.compiler }}" -t targets `
            | Select-String "pstrainc(_shared)?:"

      - name: Compile broadly (${{ matrix.compiler }})
        shell: pwsh
        run: |
          # Continue independent MSBuild projects after failed compile/link
          # tasks, exposing more than the first target's diagnostics.
          cmake --build "build-${{ matrix.compiler }}" --config Release --parallel -- `
            /p:ContinueOnError=WarnAndContinue

      # At the current production x64 ISA, contraction cannot be expressed as
      # FMA. The no-/arch canary documents that vacuity; the FMA-ISA canary
      # proves scanner discrimination, and the production scan detects ISA drift.
      - name: Compile production-ISA and FMA-ISA canaries (${{ matrix.compiler }})
        shell: pwsh
        run: |
          $artifact = "coff-${{ matrix.compiler }}"
          New-Item -ItemType Directory -Force $artifact | Out-Null
          Set-Content "$artifact/fp-contract-canary.c" `
            'double fp_contract_canary(double a, double b, double c) { return a * b + c; }'
          $releaseFlags = @("/O2", "/Ob2", "/DNDEBUG", "/MD")
          if ("${{ matrix.compiler }}" -eq "clang-cl") {
            clang-cl /nologo /c @releaseFlags /clang:-ffp-contract=fast `
              "$artifact/fp-contract-canary.c" `
              "/Fo$artifact/production-isa-canary.obj"
            clang-cl /nologo /c @releaseFlags /arch:AVX2 /clang:-ffp-contract=fast `
              "$artifact/fp-contract-canary.c" `
              "/Fo$artifact/fma-isa-canary.obj"
          } else {
            cl /nologo /c @releaseFlags /fp:precise /fp:contract `
              "$artifact/fp-contract-canary.c" `
              "/Fo$artifact/production-isa-canary.obj"
            cl /nologo /c @releaseFlags /arch:AVX2 /fp:precise /fp:contract `
              "$artifact/fp-contract-canary.c" `
              "/Fo$artifact/fma-isa-canary.obj"
          }

      - name: Stage COFF objects (${{ matrix.compiler }})
        if: always()
        shell: pwsh
        run: |
          $artifact = "coff-${{ matrix.compiler }}"
          $production = Join-Path $artifact "production"
          New-Item -ItemType Directory -Force $production | Out-Null
          $objects = Get-ChildItem "build-${{ matrix.compiler }}" -Recurse -Filter *.obj |
            Where-Object { $_.FullName -like '*\Release\*' }
          if (-not $objects) {
            throw "No Release production objects were found to stage"
          }
          $objects | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath("build-${{ matrix.compiler }}", $_.FullName)
            $destination = Join-Path $production $relative
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $_.FullName $destination
          }

      - name: Verify production-ISA vacuity boundary (${{ matrix.compiler }})
        shell: pwsh
        run: |
          $artifact = "coff-${{ matrix.compiler }}"
          $canary = Join-Path $artifact "production-isa"
          New-Item -ItemType Directory -Force $canary | Out-Null
          Copy-Item "$artifact/production-isa-canary.obj" $canary
          python scripts/check_fp_contract.py --objects $canary
          if ($LASTEXITCODE -ne 0) {
            throw "Production-ISA contraction canary unexpectedly emitted a fused instruction"
          }
          Write-Host "Production-ISA canary: PASS (no fused instruction at default x64 ISA; contraction is not expressible)."

      - name: Verify scanner discrimination at FMA ISA (${{ matrix.compiler }})
        shell: pwsh
        run: |
          $artifact = "coff-${{ matrix.compiler }}"
          $canary = Join-Path $artifact "fma-isa"
          New-Item -ItemType Directory -Force $canary | Out-Null
          Copy-Item "$artifact/fma-isa-canary.obj" $canary
          $nativeErrors = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          python scripts/check_fp_contract.py --objects $canary
          $scannerExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $nativeErrors
          if ($scannerExit -ne 1) {
            throw "FMA-ISA canary did not exercise the scanner's red path"
          }
          $global:LASTEXITCODE = 0
          Write-Host "FMA-ISA canary: PASS (scanner rejected the fused instruction)."

      - name: Detect FMA ISA drift in production objects (${{ matrix.compiler }})
        shell: pwsh
        run: |
          python scripts/check_fp_contract.py --objects "coff-${{ matrix.compiler }}/production"
          if ($LASTEXITCODE -ne 0) {
            throw "Production objects use an FMA-class instruction; re-establish the contraction boundary"
          }
          Write-Host "Production ISA-drift detector: PASS (no FMA-class instructions)."

      - name: Upload COFF objects (${{ matrix.compiler }})
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coff-${{ matrix.compiler }}
          path: coff-${{ matrix.compiler }}/
          if-no-files-found: error
