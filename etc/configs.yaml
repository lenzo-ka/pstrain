# Canonical named configurations for pstrain.
config_version: 1
profiles:
  default:
    description: Default wideband configuration
    features:
      samprate: 16000
      ncep: 13
      nfilt: 25
      nfft: 512
      lowerf: 130
      upperf: 6800
      alpha: 0.97
      dither: true
      remove_dc: true
      remove_noise: true
      frate: 100
      wlen: 0.025625
      feat_type: 1s_c_d_dd
      lifter: 22
      transform: dct
      agc: none
      cmn: batch
      cmninit: 40,3,-1
      varnorm: "no"
    training:
      n_state: 3
      n_senones: 200
      a_beam: 1.0e-90
      b_beam: 1.0e-10
      ci: {max_iterations: 10, min_iterations: 1, convergence_ratio: 0.001}
      untied: {max_iterations: 6, min_iterations: 1, convergence_ratio: 0.001}
      tied: {max_iterations: 10, min_iterations: 1, convergence_ratio: 0.001}
      max_skip_fraction: 0.05
      retry_beam_factor: 1.0e10
      failed_alignment: recover
      arctic_a0302_zero_codebook_band: null
      accept_arctic_a0587_known_skip: false
      tree_state_weights: [1.0, 0.05, 0.0]
      # Measurement isolation switches; corrected behavior ships enabled.
      tree_rotate_state_weights: true
      tree_directional_questions: true
      tree_ssplitmax: 7
      tree_ssplitthr: 0.0
      tree_csplitmax: 2000
      tree_csplitthr: 0.0
      tree_mwfloor: 1.0e-8
      tree_intermediate_dumps: false
      question_npermute: 12
      question_quests_per_state: 20
      question_niter: 1
      multipron_training: true
      optional_final_silence: true
      untied_inventory: all-triphone
      exclusion_schedule: {}
    split:
      train_ratio: null
      test_count: null
      seed: 42
    runner:
      jobs: null
      nice: 5
  wideband:
    extends: default
    description: Wideband (16kHz) microphone speech
  telephone:
    extends: default
    description: Telephone (8kHz) narrowband speech
    features:
      samprate: 8000
      nfilt: 15
      nfft: 256
      lowerf: 200
      upperf: 3500
  wideband_large:
    extends: default
    description: Wideband with more senones (larger datasets)
    training:
      n_senones: 4000
  sphinxtrain:
    extends: default
    description: Matched to SphinxTrain defaults for comparison
